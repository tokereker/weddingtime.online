<!-- Modal Visual TICKET QR Rediseñado -->
    <div id="ticket-modal" class="fixed inset-0 bg-slate-900/90 items-center justify-center z-50 hidden glass p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm flex flex-col border border-slate-200 overflow-hidden">
            
            <!-- HEADER DEL PASE REDISEÑADO (Fondo dinámico) -->
            <div id="ticket-header-bg" class="p-8 pb-4 text-center relative text-white rounded-t-3xl overflow-hidden transition-colors duration-300" style="min-height: 400px;">
                
                <!-- CAPA DE IMAGEN DE FONDO (Premium) al 90% -->
                <img id="ticket-bg-image" src="" class="absolute top-0 left-0 w-full h-[90%] object-cover opacity-0 transition-opacity duration-500 z-0 pointer-events-none">
                
                <!-- FILTRO OSCURO PARA QUE SE LEA EL TEXTO (Ajustado al 90%) -->
                <div id="ticket-dark-overlay" class="absolute top-0 left-0 w-full h-[90%] bg-slate-900/60 z-0 pointer-events-none hidden"></div>

                <!-- CONTENIDO DEL TICKET -->
                <div class="relative z-10 flex flex-col h-full justify-between">
                    <div>
                        <div id="premium-pdf-bg-uploader" class="mb-4" style="display: none;">
                            <label class="text-[9px] text-white font-bold uppercase tracking-widest cursor-pointer hover:bg-white/20 transition flex items-center justify-center gap-1 border border-white/50 py-1.5 px-3 rounded-full mx-auto w-fit backdrop-blur-sm shadow-lg">
                                <i class="fa-solid fa-image"></i> Subir Fondo Premium para PDF
                                <input type="file" id="ticket-logo-upload" class="hidden" accept="image/*" onchange="window.handleTicketLogo(event)">
                            </label>
                            <button onclick="window.clearTicketLogo()" id="btn-clear-logo" class="hidden text-[10px] text-red-300 font-bold uppercase mt-2 mx-auto underline hover:text-red-200">Quitar Fondo</button>
                        </div>

                        <h3 class="text-2xl font-black mb-1 drop-shadow-lg" id="ticket-event-name">Cargando...</h3>
                        <p class="text-[10px] text-white/80 font-bold uppercase tracking-widest mb-4">Pase de Acceso Oficial</p>
                        
                        <div class="bg-white p-3 rounded-2xl inline-block mb-4 shadow-2xl"><div id="ticket-qrcode"></div></div>
                        
                        <h2 class="text-xl font-bold text-white mb-1 drop-shadow-md truncate px-2" id="ticket-guest-name">Invitado</h2>
                        <p class="text-sm text-white/90 font-medium drop-shadow-md mb-4" id="ticket-guest-passes">0 Pases</p>
                    </div>
                </div>
            </div>

            <div class="p-4 bg-slate-50 rounded-b-3xl z-20">
                 <div class="grid grid-cols-2 gap-3 mb-3">
                     <button onclick="window.downloadNativeTicket()" class="bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-2xl font-bold shadow-md transition flex flex-col items-center justify-center gap-1">
                         <i class="fa-solid fa-file-pdf text-2xl mb-1"></i> <span class="text-[10px] uppercase tracking-wider">Descargar PDF</span>
                     </button>
                     <button onclick="window.sendTicketWAAntiBlock()" class="bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-2xl font-bold shadow-md transition flex flex-col items-center justify-center gap-1">
                         <i class="fa-brands fa-whatsapp text-2xl mb-1"></i> <span class="text-[10px] uppercase tracking-wider">Enviar por WA</span>
                     </button>
                 </div>
                 <button onclick="document.getElementById('ticket-modal').classList.replace('flex','hidden')" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3.5 rounded-xl transition text-sm">Cerrar Visualizador</button>
            </div>
        </div>
    </div>
