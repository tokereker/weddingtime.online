<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPD - Panel de Cocina y Proveedores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex flex-col font-sans">

    <!-- PANTALLA DE ACCESO (LOGIN DE PROVEEDORES) -->
    <div id="view-login" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-3xl w-full max-w-sm text-center border border-slate-700 shadow-2xl">
            <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
                <i class="fa-solid fa-bell-concierge"></i>
            </div>
            <h1 class="text-2xl font-black text-white mb-2">Portal Proveedores</h1>
            <p class="text-sm text-slate-400 mb-6">Ingresa el ID del evento que te proporcionó tu organizador.</p>
            
            <input type="text" id="input-event-id" placeholder="Ej. boda_carlos" onkeypress="if(event.key === 'Enter') window.ingresarAlPanel()" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl outline-none focus:border-blue-500 text-white text-center font-bold mb-4 transition">
            
            <button onclick="window.ingresarAlPanel()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                Conectar al Evento <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- PANTALLA DEL DASHBOARD (PANEL EN VIVO) -->
    <div id="view-dashboard" class="hidden flex-1 flex-col">
        <!-- Encabezado -->
        <header class="bg-slate-950 border-b border-slate-800 p-4 sm:p-6 flex justify-between items-center shadow-lg shrink-0">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-500/20 text-blue-400 rounded-xl flex items-center justify-center text-2xl">
                    <i class="fa-solid fa-bell-concierge"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black text-white leading-tight">Panel de Servicio <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded font-bold uppercase tracking-widest ml-2 animate-pulse">En Vivo</span></h1>
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mt-1" id="vendor-event-name">Cargando Evento...</p>
                </div>
            </div>
            <div class="text-right hidden sm:block">
                <button onclick="window.location.href='proveedores.html'" class="text-slate-400 hover:text-white text-xs font-bold flex items-center gap-1 transition"><i class="fa-solid fa-sign-out-alt"></i> Salir</button>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="flex-1 p-4 sm:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Columna Izquierda: Números Grandes -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-xl">
                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-utensils"></i> Platillos Requeridos (Confirmados)
                    </h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-900 rounded-2xl p-6 border border-slate-700 text-center flex flex-col justify-center">
                            <p class="text-5xl sm:text-7xl font-black text-blue-400 mb-2" id="v-adultos">0</p>
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Adultos</p>
                        </div>
                        <div class="bg-slate-900 rounded-2xl p-6 border border-slate-700 text-center flex flex-col justify-center">
                            <p class="text-5xl sm:text-7xl font-black text-emerald-400 mb-2" id="v-ninos">0</p>
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Niños</p>
                        </div>
                    </div>
                </div>

                <!-- Notas de Alergias -->
                <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-xl flex-1 flex flex-col">
                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> Alergias y Restricciones
                    </h2>
                    <div class="bg-slate-900 rounded-2xl p-4 border border-slate-700 overflow-y-auto max-h-64 custom-scrollbar" id="v-alergias-list">
                        <p class="text-slate-500 italic text-sm text-center py-4">Revisando base de datos...</p>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Resumen de Mesas -->
            <div class="lg:col-span-1">
                <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-xl h-full flex flex-col">
                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-chair text-purple-400"></i> Ocupación por Mesa
                    </h2>
                    <div class="flex-1 overflow-y-auto pr-2 space-y-3 custom-scrollbar" id="v-mesas-list">
                        <!-- Se llena con JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script de Lógica Específica para Proveedores -->
    <script type="module" src="./src/vendor.js"></script>
</body>
</html>
