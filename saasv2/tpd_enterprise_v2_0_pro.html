// 2. VARIABLES GLOBALES (Corregidas)
window.unsubscribe = null;
window.currentUser = null;
window.currentRole = null;
window.currentEventType = "";
window.impersonatingId = null;
window.currentTargetGuestId = null;

window.isPremiumUser = false;

window.hCurrentGuest = null; 
window.hAduToEnter = 0; 
window.hNinToEnter = 0; 
window.hMaxAdu = 0; 
window.hMaxNin = 0;

window.Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true });

const picker = document.querySelector('emoji-picker');
if (picker) {
    picker.addEventListener('emoji-click', event => {
        const textarea = document.getElementById('wa-standard-msg');
        const start = textarea.selectionStart; const end = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, start) + event.detail.unicode + textarea.value.substring(end);
        textarea.selectionStart = textarea.selectionEnd = start + event.detail.unicode.length;
        textarea.focus(); document.getElementById('emoji-picker-container').classList.add('hidden');

// 3. FUNCIONES DE AYUDA Y AUDITORÍA
function getSubdomain(eventType) {
    const map = { "XV Años": "xvana", "Bautizo": "bautizo", "Primera Comunión": "comunion", "Confirmación": "confirmacion", "Primera Comunión y Confirmación": "comunion", "Cumpleaños": "cumple", "Boda": "boda" };
    return map[eventType] || "boda";
}

window.logAction = function(action) {
    const time = new Date().toLocaleString();
    window.auditLogs.unshift(`[${time}] ${action}`);
    if(window.auditLogs.length > 50) window.auditLogs.pop(); 
};

window.showAuditLog = function() {
    const list = document.getElementById('audit-list');
    if(window.auditLogs.length === 0) { list.innerHTML = '<p class="text-sm text-slate-400 italic text-center mt-10">No hay movimientos recientes registrados en esta sesión.</p>'; }
    else { list.innerHTML = window.auditLogs.map(log => `<div class="text-xs text-slate-600 border-b border-slate-200 py-2">${log}</div>`).join(''); }
    document.getElementById('audit-modal').classList.remove('hidden'); document.getElementById('audit-modal').classList.add('flex');
};

// 4. EVENTOS DE RED (PWA)
window.addEventListener('online', () => { 
    document.body.classList.remove('offline'); 
    document.querySelectorAll('.network-status-text').forEach(el => el.innerHTML = '<i class="fa-solid fa-cloud"></i> Online (Sincronizado)');
    window.Toast.fire({icon: 'success', title: 'Conexión recuperada. Sincronizando.'});
    if(window.currentUser && window.currentRole !== 'Administrador') window.crmSave();
});

window.addEventListener('offline', () => { 
    document.body.classList.add('offline'); 
    document.querySelectorAll('.network-status-text').forEach(el => el.innerHTML = '<i class="fa-solid fa-wifi"></i> Offline (Modo Local)');
});

// 5. INTERFAZ Y DEMO
window.setAppStyleTheme = function(theme, guardarBaseDatos = true) {
    document.body.classList.remove('theme-midnight', 'theme-rosegold');
    if(theme === 'midnight') document.body.classList.add('theme-midnight');
    if(theme === 'rosegold') document.body.classList.add('theme-rosegold');
    
    if (guardarBaseDatos && window.state && window.state.config) {
        window.state.config.appTheme = theme;
        window.crmSave();
    }
};

window.startDemoEnvironment = async function() {
    const now = new Date();
    const dia = now.getDate(); const mes = now.getMonth() + 1; const hora = now.getHours();
    const pinCalculado = (dia * mes * 100) + hora;

    const { value: pinIngresado } = await Swal.fire({
        title: 'Acceso Modo Demostración',
        html: `<p class="text-sm text-slate-600 mb-4">Solicita tu PIN por WhatsApp.</p>`,
        input: 'password', 
        inputPlaceholder: 'Ingresa el PIN numérico',
        showCancelButton: true, confirmButtonColor: '#3b82f6', cancelButtonColor: '#94a3b8',
        confirmButtonText: 'Verificar PIN', cancelButtonText: 'Cancelar'
    });

    if (!pinIngresado) return;
    const llaveUsos = `demo_uses_${pinIngresado}`;
    let intentosRealizados = parseInt(localStorage.getItem(llaveUsos) || '0');

    if (intentosRealizados >= 2) { return Swal.fire({ title: 'Demostración Finalizada', text: 'Has agotado las 2 oportunidades.', icon: 'warning' }); }

    if (parseInt(pinIngresado) === pinCalculado || pinIngresado === '9999') {
        localStorage.setItem(llaveUsos, intentosRealizados + 1);

        window.currentUser = "demo_local";
        window.currentRole = "Cliente";
        window.currentEventType = "Evento";
        window.state = { 
            invitados: [ { id: 1, nombre: "Familia Bustamante", grupo: "Familia", telefono: "2202662703", adultos: 2, ninos: 1, status: "Confirmado", mesa: 1, observaciones: "Silla alta" } ], 
            mesas: [{ id: 1, nombre: "Mesa VIP" }], 
            config: { capacidadMesa: 10, themeColor: '#3b82f6', extras: 0, totalExtrasCost: 0, fontFamily: 'Plus Jakarta Sans', menuText: '', djLink: '' }, 
            croquis: null, ticketBg: null, presupuesto: []
        };
        window.isPremiumUser = true;
        const premiumDesign = document.getElementById('crm-premium-design'); if (premiumDesign) premiumDesign.style.display = window.isPremiumUser ? 'flex' : 'none';
        const tabBudget = document.getElementById('tab-budget'); if (tabBudget) tabBudget.style.display = window.isPremiumUser ? 'block' : 'none';

        document.getElementById('view-login').classList.add('hidden'); document.getElementById('view-login').classList.remove('flex');
        document.getElementById('view-crm').classList.remove('hidden'); document.getElementById('view-crm').classList.add('flex');
        document.getElementById('tpd-fab').style.display = 'flex';
        document.getElementById('user-display').innerText = "Organizador Pro (DEMO)";
        document.getElementById('crm-header-id').innerText = `${window.currentEventType} - ${window.currentUser}`;
        
        window.crmRenderAll(); window.initEventAssistant(); window.logAction("Inició sesión en Modo Demo Local.");
        window.Toast.fire({ icon: 'success', title: `¡Modo Demo!` });
    } else { Swal.fire({ title: 'Acceso Denegado', text: 'PIN incorrecto.', icon: 'error' }); }
};

window.mostrarPinDemo = function() {
    let usos = parseInt(localStorage.getItem('demo_pin_uses') || '0');
    const now = new Date(); const dia = now.getDate(); const mes = now.getMonth() + 1; const hora = now.getHours();
    const pinCalculado = (dia * mes * 100) + hora;
    
    usos++; localStorage.setItem('demo_pin_uses', usos.toString());
    Swal.fire({
        title: 'PIN de Demostración',
        html: `<div class="bg-blue-50 border border-blue-100 rounded-2xl py-4 mb-4"><span class="text-4xl font-black text-blue-600 tracking-widest">${pinCalculado}</span></div>`,
        icon: 'info', confirmButtonText: '<i class="fa-solid fa-copy"></i> Copiar', confirmButtonColor: '#10b981'
    }).then((res) => { if(res.isConfirmed) { navigator.clipboard.writeText(pinCalculado.toString()); window.Toast.fire({ icon: 'success', title: 'PIN copiado' }); } });
};

window.addPDFFooter = function(docInstance) {
    const pageCount = docInstance.internal.getNumberOfPages();
    const pageWidth = docInstance.internal.pageSize.getWidth();
    const pageHeight = docInstance.internal.pageSize.getHeight();
    for (let i = 1; i <= pageCount; i++) {
        docInstance.setPage(i); docInstance.setFontSize(8); docInstance.setTextColor(150); docInstance.text("Generado por tupasedigital.online", pageWidth / 2, pageHeight - 8, { align: 'center' });
    }
};

window.togglePassword = function(id) { const el = document.getElementById(id); el.type = el.type === "password" ? "text" : "password"; };
window.generateRandomPassword = function(targetId) {
    const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#";
    let pass = ""; for(let i=0; i<8; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
    const passInput = document.getElementById(targetId); passInput.type = 'text'; passInput.value = pass;
};

// 6. FLUJO DEL WORKSPACE CRM
window.setupClientEnvironment = function(userToLoad, dataSnapshot = null) {
    window.currentUser = userToLoad;
    document.getElementById('view-login').classList.add('hidden'); document.getElementById('view-login').classList.remove('flex');
    document.getElementById('view-admin').classList.add('hidden'); document.getElementById('view-admin').classList.remove('flex');
    document.getElementById('view-crm').classList.remove('hidden'); document.getElementById('view-crm').classList.add('flex');
    document.getElementById('tpd-fab').style.display = 'flex';
    document.getElementById('user-display').innerText = window.currentRole === 'Cliente' ? 'Organizador Pro (CRM)' : window.currentRole;
    
    if (dataSnapshot && !dataSnapshot.eventType && (!window.impersonatingId)) {
        document.getElementById('welcome-modal').classList.remove('hidden'); document.getElementById('welcome-modal').classList.add('flex');
    } else { window.subscribeToUser(userToLoad); }
    window.crmSwitchTab('guests'); Swal.close();
};

window.toggleCustomEventInput = function(selectId, inputId) {
    const select = document.getElementById(selectId); const input = document.getElementById(inputId);
    if(select.value === 'Otro') { input.classList.remove('hidden'); input.focus(); } else { input.classList.add('hidden'); input.value = ''; }
};

window.saveWelcomeEventType = async function() {
    try {
        const selectVal = document.getElementById('welcome-event-type').value; let type = selectVal;
        if(selectVal === 'Otro') { type = document.getElementById('welcome-event-custom').value.trim(); if(!type) return window.Toast.fire({icon:'warning', title:'Escribe el tipo de evento'}); }
        const activeTarget = window.impersonatingId || window.currentUser;
        const docRef = doc(db, 'artifacts', 'weddingflow', 'users', activeTarget);
        await setDoc(docRef, { eventType: type }, { merge: true });
        document.getElementById('welcome-modal').classList.replace('flex', 'hidden'); window.subscribeToUser(activeTarget);
    } catch(e) { Swal.fire('Error', 'Fallo al guardar evento', 'error'); }
};

window.subscribeToUser = function(user) {
    if (window.unsubscribe) window.unsubscribe();
    const docRef = doc(db, 'artifacts', 'weddingflow', 'users', user);
    
    window.unsubscribe = onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const data = docSnap.data();
            window.state.invitados = data.invitados || []; window.state.mesas = data.mesas || window.state.mesas; window.state.config = data.config || window.state.config;
            window.state.presupuesto = data.presupuesto || []; 
            if(!window.state.config.themeColor) window.state.config.themeColor = '#3b82f6';

            const userTheme = window.state.config.appTheme || 'default';
            window.setAppStyleTheme(userTheme, false);
            const selectTheme = document.getElementById('crm-theme-style'); if(selectTheme) selectTheme.value = userTheme;
            
            if(!window.state.config.extras) window.state.config.extras = 0;
            if(window.state.config.totalExtrasCost === undefined) window.state.config.totalExtrasCost = 0;
            if(!window.state.config.fontFamily) window.state.config.fontFamily = 'Plus Jakarta Sans';
            if(!window.state.config.menuText) window.state.config.menuText = '';
            if(!window.state.config.djLink) window.state.config.djLink = '';

            window.state.croquis = data.croquis || null; window.state.ticketBg = data.ticketBg || null;
            window.isPremiumUser = data.hasPremiumLink === true; window.currentEventType = data.eventType || window.currentEventType;
            
            const tipo = window.currentEventType || 'Evento';
            document.getElementById('crm-header-id').innerText = `${tipo} - ${user}`;
            const btnMesasName = document.getElementById('btn-mesas-event-name'); if (btnMesasName) btnMesasName.innerText = `${tipo} - ${user}`;
            
            document.documentElement.style.setProperty('--primary-color', window.state.config.themeColor);
            const colorPicker = document.getElementById('crm-theme-color'); if (colorPicker) colorPicker.value = window.state.config.themeColor;
            const fontPicker = document.getElementById('crm-font-family'); if (fontPicker) fontPicker.value = window.state.config.fontFamily;
            
            const iconEl = document.getElementById('header-main-icon');
            if (iconEl) {
                iconEl.className = 'fa-solid '; const tLower = tipo.toLowerCase();
                if (tLower.includes('boda')) iconEl.classList.add('fa-ring'); else if (tLower.includes('xv') || tLower.includes('15')) iconEl.classList.add('fa-crown');
                else if (tLower.includes('comunión') || tLower.includes('confirmación') || tLower.includes('bautizo')) iconEl.classList.add('fa-dove');
                else if (tLower.includes('cumple')) iconEl.classList.add('fa-cake-candles'); else iconEl.classList.add('fa-calendar-check');
            }
            
            const premiumDesign = document.getElementById('crm-premium-design'); if (premiumDesign) premiumDesign.style.display = window.isPremiumUser ? 'flex' : 'none';
            const tabBudget = document.getElementById('tab-budget'); if (tabBudget) tabBudget.style.display = window.isPremiumUser ? 'block' : 'none';
            const waPremiumContainer = document.getElementById('wa-premium-link-container'); const waCheckbox = document.getElementById('wa-include-link');
            if (waPremiumContainer && waCheckbox) { waPremiumContainer.style.display = window.isPremiumUser ? 'flex' : 'none'; waCheckbox.checked = window.isPremiumUser; waCheckbox.disabled = !window.isPremiumUser; }

            if(typeof window.crmRenderAll === 'function') window.crmRenderAll();
            window.initEventAssistant();
            if(document.getElementById('view-hostess') && !document.getElementById('view-hostess').classList.contains('hidden')) { window.hostessRenderLiveStats(); }
        }
    });
};

// 7. CHATBOT IA
window.initEventAssistant = function() {
    const activeId = window.impersonatingId || window.currentUser || "demo_id";
    const container = document.getElementById('tpd-chat-messages');
    const titleEl = document.getElementById('tpd-chat-title');
    const evento = window.currentEventType || 'Evento';
    
    if(titleEl) titleEl.innerHTML = `<i class="fa-solid fa-brain mr-2"></i> IA: ${evento}`;
    
    const saludos = [
        `¡Hola! Qué gusto saludarte. Soy el asistente IA de tu <b>${evento}</b>. <br><br>Actualmente estoy analizando el ID <i>${activeId}</i>. ¿En qué te puedo ayudar hoy?`,
        `¡Bienvenido! Soy tu asistente de logística. <br><br>Sincronizado con <i>${activeId}</i>. Pregúntame sobre mesas, bebidas o invitados.`
    ];
    const initialMsg = saludos[Math.floor(Math.random() * saludos.length)];
    if(container) container.innerHTML = `<div class="tpd-msg bot">${initialMsg}</div>`;
};

window.toggleTPDChat = function() {
    const chat = document.getElementById('tpd-chat-widget'); const fab = document.getElementById('tpd-fab');
    if(chat.style.display === 'flex') { chat.style.display = 'none'; fab.style.display = 'flex'; } else { chat.style.display = 'flex'; fab.style.display = 'none'; document.getElementById('tpd-chat-input').focus(); }
};

window.sendTPDChat = function() {
    const input = document.getElementById('tpd-chat-input'); const text = input.value.trim().toLowerCase(); if(!text) return;
    const container = document.getElementById('tpd-chat-messages'); 
    container.innerHTML += `<div class="tpd-msg user">${input.value.trim()}</div>`; 
    input.value = ''; container.scrollTop = container.scrollHeight;
    
    const loadingId = 'loading-' + Date.now(); 
    container.innerHTML += `<div id="${loadingId}" class="tpd-msg bot"><i class="fa-solid fa-spinner fa-spin"></i> Pensando...</div>`; 
    container.scrollTop = container.scrollHeight;

    setTimeout(() => {
        document.getElementById(loadingId).remove();
        
        let cAdu = 0, cNin = 0, sinMesa = 0, declinados = 0, totalPases = 0, pendientes = 0;
        window.state.invitados.forEach(g => {
            let ads = parseInt(g.adultos !== undefined ? g.adultos : g.pases) || 0; let nns = parseInt(g.ninos) || 0; let tot = ads + nns;
            totalPases += tot;
            if (g.status === 'Confirmado') { cAdu += ads; cNin += nns; if(g.mesa === 0) sinMesa += tot; } 
            else if (g.status === 'Declinado') { declinados += tot; }
            else if (g.status === 'Pendiente') { pendientes += tot; }
        });

        const totalConfirmados = cAdu + cNin;
        let reply = "";

        if (/resumen|estatus|como vamos|cuantos|total|estadistica/.test(text)) {
            reply = `📊 <b>Total en catálogo:</b> ${totalPases} pases.<br>✅ <b>Confirmados:</b> ${totalConfirmados} (${cAdu}A, ${cNin}N).<br>⏳ <b>Pendientes:</b> ${pendientes} pases.<br>❌ <b>Declinados:</b> ${declinados}.`;
        } 
        else if (/bebida|alcohol|pisto|chelas|cerveza|vino|botella|hielo|refresco|chupe/.test(text)) {
            if(cAdu === 0) { reply = "Aún no tienes adultos confirmados para calcular la bebida."; } 
            else { reply = `🍾 <b>Barra (${cAdu} Adultos):</b><br>• Destilados: <b>${Math.ceil(cAdu / 3)} bots</b>.<br>• Cervezas: <b>${Math.ceil(cAdu * 3)} pz</b>.<br>• Refresco: <b>${Math.ceil(((cAdu * 1) + (cNin * 0.5)) * 1.15)} L</b>.<br>• Hielo: <b>${Math.ceil(cAdu * 1)} kg</b>.`; }
        }
        else if (/mesa|silla|acomodo|lugar|sentar|espacio/.test(text)) {
            let capacidad = window.state.mesas.length * (parseInt(window.state.config.capacidadMesa)||10);
            reply = `Tienes ${window.state.mesas.length} mesas (Capacidad: <b>${capacidad} personas</b>). Tienes <b>${totalConfirmados} confirmados</b>.`;
        }
        else if (/presupuesto|dinero|gasto|pagado|deuda|cobro|costo/.test(text)) {
            let stTotal = window.state.presupuesto.reduce((sum, item) => sum + item.costo, 0);
            let stPaid = window.state.presupuesto.reduce((sum, item) => sum + item.pagado, 0);
            reply = `💰 <b>Resumen Financiero:</b><br>• Tu evento costará aprox: <b>$${stTotal.toLocaleString('en-US')}</b><br>• Has pagado: <b>$${stPaid.toLocaleString('en-US')}</b><br>• Tienes una deuda de: <b>$${(stTotal - stPaid).toLocaleString('en-US')}</b>`;
        }
        else {
            const palabras = text.split(" ").filter(p => p.length > 2);
            let invitadoEncontrado = null;
            for (let g of window.state.invitados) {
                const nombreLower = g.nombre.toLowerCase();
                if (palabras.some(palabra => nombreLower.includes(palabra))) { invitadoEncontrado = g; break; }
            }
            if (invitadoEncontrado) {
                let mesaTexto = invitadoEncontrado.mesa === 0 ? "⚠️ Sin mesa asignada." : `✅ Mesa ${window.state.mesas.find(m=>m.id===invitadoEncontrado.mesa)?.nombre || invitadoEncontrado.mesa}.`;
                reply = `¡Encontré a <b>${invitadoEncontrado.nombre}</b>!<br>• Estatus: ${invitadoEncontrado.status}<br>• Pases: ${(invitadoEncontrado.adultos||invitadoEncontrado.pases||0)}A, ${invitadoEncontrado.ninos||0}N<br>• Grupo: ${invitadoEncontrado.grupo}<br>${mesaTexto}`;
            } else {
                reply = "Mmm... No estoy seguro de entender eso. Intenta pedirme calcular <b>bebidas</b>, ver <b>mesas</b>, buscar a alguien o <b>presupuesto</b>.";
            }
        }
        container.innerHTML += `<div class="tpd-msg bot">${reply}</div>`; container.scrollTop = container.scrollHeight;
    }, 800);
};

// 8. FUNCIONES EXCLUSIVAS DE LA HOSTESS
window.promptHostessLogin = async function() {
    const { value: eventId } = await Swal.fire({ title: 'Recepción Hostess', input: 'text', inputLabel: 'ID del Evento', inputPlaceholder: 'Ej: boda_carlos', showCancelButton: true, confirmButtonColor: '#3b82f6' });
    if (eventId) { window.loadHostessView(eventId.toLowerCase().trim()); } else {
        if (window.currentRole === 'Administrador' || window.currentRole === 'Staff' || window.currentRole === 'Soporte') { window.appExitImpersonation(); } else { window.appLogout(); }
    }
};

window.hostessSmartExit = function() {
    if (window.impersonatingId && window.currentRole !== 'Hostess') {
         document.getElementById('view-hostess').classList.add('hidden'); document.getElementById('view-hostess').classList.remove('flex'); window.appExitImpersonation();
    } else { window.appLogout(); }
};

window.hostessRenderLiveStats = function() {
    let totalEsperados = 0; let totalIngresados = 0; let extras = window.state.config.extras || 0; let deuda = window.state.config.totalExtrasCost || 0;
    const container = document.getElementById('hostess-live-list-container'); if(container) container.innerHTML = '';

    window.state.invitados.forEach(g => {
        let ads = parseInt(g.adultos !== undefined ? g.adultos : g.pases) || 0; let nns = parseInt(g.ninos) || 0;
        let ingA = parseInt(g.ingresadosA) || 0; let ingN = parseInt(g.ingresadosN) || 0;
        let tot = ads + nns; let ingTot = ingA + ingN;
        totalEsperados += tot; totalIngresados += ingTot;

        if(container && tot > 0) {
            let semaforoBg = 'bg-red-50 border-red-200'; let semaforoTx = 'text-red-700'; let semaforoIc = 'fa-times-circle';
            if (ingTot === tot) { semaforoBg = 'bg-emerald-50 border-emerald-200'; semaforoTx = 'text-emerald-700'; semaforoIc = 'fa-check-circle'; }
            else if (ingTot > 0) { semaforoBg = 'bg-amber-50 border-amber-200'; semaforoTx = 'text-amber-700'; semaforoIc = 'fa-exclamation-circle'; }

            const div = document.createElement('div'); div.className = `p-3 rounded-xl border ${semaforoBg} shadow-sm flex justify-between items-center`;
            div.innerHTML = `<div><p class="font-bold text-sm text-slate-800">${g.nombre}</p><p class="text-[10px] font-bold text-slate-500 mt-0.5">Grupo: ${g.grupo || '-'}</p></div><div class="text-right"><p class="font-black text-lg ${semaforoTx}"><i class="fa-solid ${semaforoIc} text-sm mr-1"></i> ${ingTot}/${tot}</p><button onclick="window.processHostessAccess(${g.id})" class="text-[10px] bg-white border border-slate-200 px-2 py-1 rounded shadow-sm text-slate-600 font-bold hover:bg-blue-50 hover:text-blue-600 mt-1 transition">Ver / Editar</button></div>`;
            container.appendChild(div);
        }
    });
    
    let totalGeneral = totalIngresados + extras;
    document.getElementById('h-total-esperados').innerText = totalEsperados; document.getElementById('h-total-ingresados').innerText = totalIngresados; 
    document.getElementById('h-total-extras').innerText = extras; document.getElementById('h-total-general').innerText = totalGeneral;
    
    const deudaBadge = document.getElementById('h-deuda-badge');
    if (deuda > 0) { deudaBadge.innerText = `+$${deuda.toFixed(2)}`; deudaBadge.classList.remove('hidden'); } else { deudaBadge.classList.add('hidden'); }
};

window.hostessAddExtra = function() {
    Swal.fire({
        title: 'Registrar Extras',
        html: `
            <div class="mb-4">
                <label class="text-xs font-bold text-slate-500 text-left block mb-2">Cantidad de personas extra:</label>
                <div class="flex items-center justify-center gap-3">
                    <button type="button" onclick="document.getElementById('extra-qty-input').stepDown()" class="w-12 h-12 rounded-xl bg-slate-100 text-slate-700 font-bold hover:bg-slate-200 transition text-2xl border border-slate-200">-</button>
                    <input type="number" id="extra-qty-input" class="w-24 text-center font-black text-2xl border-2 border-slate-200 rounded-xl p-2" value="1" min="1">
                    <button type="button" onclick="document.getElementById('extra-qty-input').stepUp()" class="w-12 h-12 rounded-xl bg-slate-100 text-slate-700 font-bold hover:bg-slate-200 transition text-2xl border border-slate-200">+</button>
                </div>
            </div>
            <div class="mt-6 pt-4 border-t border-slate-100">
                <label class="text-xs font-bold text-slate-500 text-left block mb-1">Costo individual ($):</label>
                <input type="number" id="extra-cost-input" class="swal2-input !m-0 !w-full text-center" placeholder="Ej. 500" min="0">
            </div>
        `,
        showCancelButton: true, confirmButtonText: 'Registrar', confirmButtonColor: '#d97706',
        preConfirm: () => {
            const qty = parseInt(document.getElementById('extra-qty-input').value) || 1; const cost = parseFloat(document.getElementById('extra-cost-input').value) || 0;
            return { qty, cost };
        }
    }).then(r => {
        if (r.isConfirmed) {
            const cantidad = r.value.qty > 0 ? r.value.qty : 1; const costoIndiv = r.value.cost;
            window.state.config.extras = (window.state.config.extras || 0) + cantidad;
            if (costoIndiv > 0) { window.state.config.totalExtrasCost = (window.state.config.totalExtrasCost || 0) + (costoIndiv * cantidad); }
            window.crmSave(); window.hostessRenderLiveStats(); window.Toast.fire({icon: 'success', title: `${cantidad} invitados extra registrados`}); 
            window.logAction(`Hostess registró ${cantidad} extra(s) en puerta.`);
        }
    });
};

window.hostessSwitchTab = function(tab) {
    ['scanner', 'list', 'croquis'].forEach(t => {
        document.getElementById(`hview-${t}`).classList.replace('flex', 'hidden');
        document.getElementById(`htab-${t}`).className = 'flex-1 py-1.5 sm:py-2 rounded-lg text-[10px] sm:text-xs font-bold text-slate-400 hover:text-white transition';
    });
    document.getElementById(`hview-${tab}`).classList.replace('hidden', 'flex');
    document.getElementById(`htab-${tab}`).className = 'flex-1 py-1.5 sm:py-2 rounded-lg text-[10px] sm:text-xs font-bold bg-blue-600 text-white shadow-md transition';
    
    if(tab === 'croquis' || tab === 'list') { if(window.html5QrcodeScanner) { try { window.html5QrcodeScanner.stop().catch(e=>{}); } catch(err){} } }
    if(tab === 'list') window.hostessRenderLiveStats();
};

window.loadHostessView = async function(eventId) {
    Swal.fire({ title: 'Buscando evento...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
    try {
        const docRef = doc(db, 'artifacts', 'weddingflow', 'users', eventId); const snap = await getDoc(docRef);
        
        if (snap.exists()) {
            window.impersonatingId = eventId;
            document.getElementById('view-login').classList.add('hidden'); document.getElementById('view-admin').classList.add('hidden');
            document.getElementById('view-crm').classList.add('hidden'); document.getElementById('view-hostess').classList.remove('hidden'); document.getElementById('view-hostess').classList.add('flex');
            document.getElementById('tpd-fab').style.display = 'none'; document.getElementById('tpd-chat-widget').style.display = 'none';
            
            const data = snap.data(); const tipo = data.eventType || 'Evento'; document.getElementById('hostess-event-id').innerText = `${tipo} - ${eventId}`;
            
            window.state.invitados = data.invitados || []; window.state.mesas = data.mesas || []; window.state.croquis = data.croquis || null; window.state.config = data.config || window.state.config;
            if (window.state.croquis) { document.getElementById('hostess-croquis-img').src = window.state.croquis; document.getElementById('hostess-croquis-img').classList.remove('hidden'); document.getElementById('hostess-no-croquis').classList.add('hidden'); }
            
            window.hostessSwitchTab('scanner'); window.subscribeToUser(eventId); Swal.close();
        } else {
            Swal.fire({ title: 'Error', text: 'El ID de evento no existe.', icon: 'error' }).then(() => { window.promptHostessLogin(); });
        }
    } catch(e) { Swal.fire('Error', 'Fallo de conexión.', 'error').then(() => window.appLogout()); }
};

window.startScanner = function() {
    document.getElementById('btn-start-scanner').classList.add('hidden');
    window.html5QrcodeScanner = new Html5Qrcode("reader");
    window.html5QrcodeScanner.start(
        { facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
            try {
                const url = new URL(decodedText); const gId = parseInt(url.searchParams.get("id"));
                if(gId) { window.html5QrcodeScanner.stop(); document.getElementById('btn-start-scanner').classList.remove('hidden'); window.processHostessAccess(gId); }
            } catch(e) {}
        }, (err) => {}
    ).catch(err => {
        document.getElementById('btn-start-scanner').classList.remove('hidden');
        Swal.fire('Cámara Bloqueada', 'Por favor permite el acceso a la cámara.', 'warning');
    });
};

window.hostessManualSearch = function() {
    const query = document.getElementById('hostess-search').value.toLowerCase();
    const res = document.getElementById('hostess-search-results'); res.innerHTML = '';
    if(query.length < 2) return;
    window.state.invitados.filter(g => g.nombre.toLowerCase().includes(query)).forEach(g => {
        const btn = document.createElement('button'); btn.className = 'w-full bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg text-left text-sm font-bold flex justify-between items-center transition mb-1';
        btn.innerHTML = `<span>${g.nombre}</span> <i class="fa-solid fa-arrow-right text-blue-400"></i>`;
        btn.onclick = () => window.processHostessAccess(g.id); res.appendChild(btn);
    });
};

window.processHostessAccess = function(gId) {
    const g = window.state.invitados.find(x => x.id === gId); if(!g) return Swal.fire('Error', 'Invitado no encontrado.', 'error');
    if(navigator.vibrate) navigator.vibrate([100, 50, 100]);

    let totalA = parseInt(g.adultos !== undefined ? g.adultos : g.pases) || 0; let totalN = parseInt(g.ninos) || 0;
    let ingA = parseInt(g.ingresadosA) || 0; let ingN = parseInt(g.ingresadosN) || 0;

    window.hMaxAdu = totalA - ingA; window.hMaxNin = totalN - ingN;

    if (window.hMaxAdu <= 0 && window.hMaxNin <= 0) {
        if(navigator.vibrate) navigator.vibrate([300, 100, 300]);
        return Swal.fire({ title: '¡Acceso Denegado!', text: 'Este grupo ya utilizó todos sus pases registrados.', icon: 'error', confirmButtonColor: '#ef4444' });
    }

    window.hCurrentGuest = g; window.hAduToEnter = window.hMaxAdu > 0 ? window.hMaxAdu : 0; window.hNinToEnter = window.hMaxNin > 0 ? window.hMaxNin : 0;
    document.getElementById('hr-name').innerText = g.nombre;
    const mName = g.mesa === 0 ? "Sin Asignar" : (window.state.mesas.find(m => m.id === g.mesa)?.nombre || "Desconocida");
    document.getElementById('hr-table').innerText = mName;
    document.getElementById('hr-adu-status').innerText = `Han entrado ${ingA} de ${totalA}`; document.getElementById('hr-nin-status').innerText = `Han entrado ${ingN} de ${totalN}`;
    document.getElementById('hr-nin-row').style.display = totalN > 0 ? 'flex' : 'none';

    window.updateEntryUI();

    const modal = document.getElementById('hostess-result-modal'); const box = document.getElementById('hostess-result-box');
    modal.classList.remove('hidden'); modal.classList.add('flex');
    setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
    document.getElementById('hostess-search').value = ''; document.getElementById('hostess-search-results').innerHTML = '';
};

window.adjEntry = function(tipo, val) {
    if (tipo === 'adu') { window.hAduToEnter += val; if(window.hAduToEnter < 0) window.hAduToEnter = 0; if(window.hAduToEnter > window.hMaxAdu) window.hAduToEnter = window.hMaxAdu; } 
    else { window.hNinToEnter += val; if(window.hNinToEnter < 0) window.hNinToEnter = 0; if(window.hNinToEnter > window.hMaxNin) window.hNinToEnter = window.hMaxNin; }
    window.updateEntryUI();
};

window.updateEntryUI = function() {
    document.getElementById('hr-adu-entering').innerText = window.hAduToEnter; document.getElementById('hr-nin-entering').innerText = window.hNinToEnter;
    const btn = document.getElementById('hr-confirm-btn');
    if (window.hAduToEnter === 0 && window.hNinToEnter === 0) { btn.classList.replace('bg-blue-600', 'bg-slate-400'); btn.disabled = true; } else { btn.classList.replace('bg-slate-400', 'bg-blue-600'); btn.disabled = false; }
};

window.confirmHostessEntry = function() {
    if(!window.hCurrentGuest) return;
    window.hCurrentGuest.ingresadosA = (parseInt(window.hCurrentGuest.ingresadosA) || 0) + window.hAduToEnter; window.hCurrentGuest.ingresadosN = (parseInt(window.hCurrentGuest.ingresadosN) || 0) + window.hNinToEnter;
    window.crmSave(); window.closeHostessResult(); window.Toast.fire({icon: 'success', title: `Registrado: ${window.hAduToEnter} Adultos, ${window.hNinToEnter} Niños`}); window.hostessRenderLiveStats();
    window.logAction(`Ingreso registrado: ${window.hCurrentGuest.nombre} (${window.hAduToEnter}A, ${window.hNinToEnter}N)`);
};

window.closeHostessResult = function() {
    const modal = document.getElementById('hostess-result-modal'); const box = document.getElementById('hostess-result-box');
    box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
    setTimeout(() => { modal.classList.replace('flex', 'hidden'); }, 200);
};

window.hostessExportReportPDF = function() {
    const { jsPDF } = window.jspdf; const doc = new jsPDF(); const eventId = window.impersonatingId || window.currentUser || "Evento";
    
    doc.setFontSize(16); doc.setTextColor(37, 99, 235); doc.text(`Reporte de Recepcion (Hostess) - ${eventId}`, 14, 15);
    
    let totalEsperados = 0, totalIngresados = 0;
    window.state.invitados.forEach(g => {
        let ads = parseInt(g.adultos !== undefined ? g.adultos : g.pases) || 0; let nns = parseInt(g.ninos) || 0;
        let ingA = parseInt(g.ingresadosA) || 0; let ingN = parseInt(g.ingresadosN) || 0;
        if (g.status === 'Confirmado' || g.status === 'Pendiente') { totalEsperados += (ads + nns); } totalIngresados += (ingA + ingN);
    });
    
    let extras = window.state.config.extras || 0; let deuda = window.state.config.totalExtrasCost || 0; let totalGeneral = totalIngresados + extras;

    doc.setFontSize(12); doc.setTextColor(50, 50, 50); doc.text(`Resumen Numerico Final:`, 14, 25);
    doc.setFontSize(10); doc.text(`- Invitados esperados en lista: ${totalEsperados}`, 14, 32); doc.text(`- Invitados que ingresaron de la lista: ${totalIngresados}`, 14, 38);
    doc.text(`- Personas extra cobradas en puerta: ${extras}`, 14, 44); doc.text(`- TOTAL DE PERSONAS EN EL SALON: ${totalGeneral}`, 14, 50);
    if (deuda > 0) { doc.setTextColor(220, 38, 38); doc.text(`- Costo Acumulado de Extras (Deuda): $${deuda.toFixed(2)}`, 14, 56); }

    const body = [];
    window.state.invitados.forEach(g => {
        let tot = (parseInt(g.adultos !== undefined ? g.adultos : g.pases) || 0) + (parseInt(g.ninos) || 0); let ing = (parseInt(g.ingresadosA) || 0) + (parseInt(g.ingresadosN) || 0);
        if (ing > 0) { const mesaNombre = g.mesa === 0 ? "Sin Asignar" : (window.state.mesas.find(m => m.id === g.mesa)?.nombre || "Desconocida"); body.push([g.nombre, g.grupo || '-', tot, ing, mesaNombre]); }
    });

    doc.autoTable({ startY: deuda > 0 ? 65 : 60, head: [['Familia / Invitado', 'Grupo', 'Pases', 'Ingresaron', 'Mesa']], body: body, theme: 'grid', headStyles: { fillColor: [37, 99, 235] } });

    let finalY = doc.lastAutoTable.finalY || 65; if (finalY > 240) { doc.addPage(); finalY = 20; }
    doc.setFontSize(10); doc.setTextColor(50, 50, 50); doc.text("________________________________________________", 105, finalY + 40, { align: "center" });
    doc.setFontSize(9); doc.text("Firma de Conformidad (Organizador / Cliente)", 105, finalY + 45, { align: "center" });
    window.addPDFFooter(doc); doc.save(`Corte_Hostess_${eventId}.pdf`);
    window.logAction("Hostess descargó el reporte final en PDF.");
};
</script>
